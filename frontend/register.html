<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Mindful Support</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body data-page="register">
    <div class="gradient-flow" aria-hidden="true"></div>
    <div class="bg-particles" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="page-shell auth-shell">
      <section class="auth-card">
        <h1>Create account</h1>
        <p class="subtitle">A private and supportive space for your journey.</p>

        <form id="register-form" class="form-stack">
          <label for="username">Username</label>
          <input id="username" type="text" placeholder="Choose a username" required />

          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" required />

          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Create a secure password" required />

          <button id="register-btn" type="submit">Create Account</button>
        </form>

        <p class="status-row">
          Already have an account?
          <a href="login.html">Sign in</a>
        </p>
      </section>
    </div>

    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/auth-pages.js"></script>
  </body>
</html>
